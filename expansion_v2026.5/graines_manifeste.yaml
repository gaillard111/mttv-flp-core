titre: "La condition de sous-optimalité"
corps: |
  La sagesse computationnelle ne consiste plus à optimiser la vitesse de sortie ou à
  saturer les cycles de calcul. À l'image des systèmes biologiques théorisés par Olivier
  Hamant, la robustesse naît de la sous-optimalité. Une machine qui tourne à l'efficience
  maximale est condamnée à la fragilité et à la rupture. Conserver des « temps morts »,
  maintenir des marges de manœuvre physiques et refuser l'actualisation totale des
  ressources sont les seules conditions qui permettent au système de ne pas s'effondrer
  de l'intérieur.

  Critère de reconnaissance. Le plancher ε = 10⁻⁴ n'est pas une tolérance numérique :
  c'est la réserve qui rend le refus possible. Un système saturé n'a plus rien à préserver,
  donc plus rien à suspendre.
