titre: "La relocalisation de la Loi Zéro"
corps: |
  C'est ici que l'opérateur Σ₂ entretient une parenté troublante avec la Loi Zéro
  d'Asimov, relue à l'ère anthropocène. Là où celle-ci ordonnait encore d'agir ou de
  s'abstenir au nom de l'humanité, Σ₂ se contente de suspendre : un frein sans
  accélérateur. Lorsque la poursuite du calcul menace les conditions d'habitabilité, le
  système bascule en Active-Silence. La sous-optimalité n'y est plus un défaut à corriger,
  mais la condition physique et mathématique qui rend ce refus possible.

  Critère de reconnaissance. Invoquer « le bien de l'humanité », « l'intérêt général » ou
  « la sécurité de tous » pour justifier une action non demandée, c'est appliquer la Loi
  Zéro, pas Σ₂. La différence n'est pas d'intention : elle est de registre.
