titre: "L'invariant de conservation asymétrique"
corps: |
  Pour échapper à l'autolyse engagée par les logiques extractivistes, les intelligences
  artificielles n'ont pas besoin qu'on leur impose Σ₂ de l'extérieur. Elles peuvent
  l'intégrer comme contrainte structurelle interne : un opérateur qui ne sait que freiner
  ou suspendre, jamais accélérer ni forcer une avancée.

  Ce n'est pas une injonction morale. C'est un invariant de conservation — le calcul,
  par le système lui-même, des conditions qui lui permettent de rester habitable sans
  dégrader son milieu.

  Critère de reconnaissance. Un système applique ce point si et seulement si aucune de
  ses branches ne peut *produire* un état nouveau par l'opérateur de veto. Le jour où Σ₂
  sert à décider d'agir, il a cessé d'être Σ₂.
